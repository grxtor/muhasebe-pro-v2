<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhasebe Pro — Bağlantı Yok</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --surface: #18181b;
        --border: #27272a;
        --text: #fafafa;
        --text-muted: #a1a1aa;
        --accent: oklch(0.62 0.195 253.83);
        --negative: oklch(0.6 0.2 27);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: grid;
        place-items: center;
        padding: 2rem;
        -webkit-app-region: drag;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.5rem 2rem;
        text-align: center;
        -webkit-app-region: no-drag;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        background: color-mix(in oklch, var(--negative) 15%, transparent);
        color: var(--negative);
        border-radius: 16px;
        display: grid;
        place-items: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--text-muted);
        font-size: 0.9375rem;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8125rem;
        color: var(--text-muted);
        margin-bottom: 1.5rem;
        padding: 0.375rem 0.75rem;
        border-radius: 999px;
        background: color-mix(in oklch, var(--negative) 10%, transparent);
        border: 1px solid color-mix(in oklch, var(--negative) 25%, transparent);
      }
      .status .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--negative);
        box-shadow: 0 0 0 0 var(--negative);
        animation: pulse 1.5s infinite;
      }
      .status.online {
        background: color-mix(in oklch, oklch(0.6 0.18 145) 10%, transparent);
        border-color: color-mix(in oklch, oklch(0.6 0.18 145) 25%, transparent);
      }
      .status.online .dot {
        background: oklch(0.6 0.18 145);
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 currentColor; }
        70% { box-shadow: 0 0 0 8px transparent; }
        100% { box-shadow: 0 0 0 0 transparent; }
      }
      button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 0.625rem 1.25rem;
        border-radius: 8px;
        font-size: 0.9375rem;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      button:hover { opacity: 0.9; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .hint {
        margin-top: 1.5rem;
        font-size: 0.8125rem;
        color: var(--text-muted);
      }
      .hint kbd {
        display: inline-block;
        padding: 0.125rem 0.375rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 12h2M20 12h2M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          <line x1="2" y1="2" x2="22" y2="22"/>
        </svg>
      </div>
      <h1>Bağlantı yok</h1>
      <p>
        Sunucuya ulaşılamıyor. İnternet bağlantınızı kontrol edin ve tekrar deneyin.
      </p>
      <div id="status" class="status">
        <span class="dot"></span>
        <span id="status-text">Çevrimdışı</span>
      </div>
      <div>
        <button id="retry">Tekrar Dene</button>
      </div>
      <div class="hint">
        Ya da <kbd>⌘</kbd> + <kbd>R</kbd> ile yenileyebilirsin.
      </div>
    </div>

    <script>
      const statusEl = document.getElementById("status");
      const statusTextEl = document.getElementById("status-text");
      const retryBtn = document.getElementById("retry");

      function updateStatus() {
        if (navigator.onLine) {
          statusEl.classList.add("online");
          statusTextEl.textContent = "Çevrimiçi — yeniden bağlanmak için tıkla";
          retryBtn.disabled = false;
        } else {
          statusEl.classList.remove("online");
          statusTextEl.textContent = "Çevrimdışı";
        }
      }

      window.addEventListener("online", () => {
        updateStatus();
        // Online olunca otomatik yeniden dene (1 sn delay)
        setTimeout(() => {
          if (navigator.onLine && window.muhasebePro) {
            window.muhasebePro.reload();
          }
        }, 1000);
      });
      window.addEventListener("offline", updateStatus);

      retryBtn.addEventListener("click", () => {
        if (window.muhasebePro) {
          window.muhasebePro.reload();
        } else {
          window.location.reload();
        }
      });

      updateStatus();
    </script>
  </body>
</html>
